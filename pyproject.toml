[project]
name = "threatflow"
version = "0.1.0"
description = "Cybersecurity intelligence data engineering platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
threatflow-backfill-range = "threatflow.orchestration.backfill_controller:main"
threatflow-backfill-status = "threatflow.orchestration.backfill_status:main"
threatflow-build-cisa-changes = "threatflow.derivations.cisa_changes:main"
threatflow-backup-databases = "threatflow.database_backup:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.10,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
