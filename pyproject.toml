[project]
name = "threatflow"
version = "0.1.0"
description = "Cybersecurity intelligence data engineering platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "botocore[crt]>=1.35,<2",
    "pyarrow>=26.0,<27",
]

[project.scripts]
threatflow-backfill-range = "threatflow.orchestration.backfill_controller:main"
threatflow-backfill-status = "threatflow.orchestration.backfill_status:main"
threatflow-build-cisa-changes = "threatflow.derivations.cisa_changes:main"
threatflow-watch-cisa = "threatflow.ingestion.cisa_watcher:main"
threatflow-backup-databases = "threatflow.database_backup:main"
threatflow-reconcile-raw-storage = "threatflow.raw_storage_reconciliation:main"
threatflow-restore-raw-artifact = "threatflow.raw_storage_restore:main"
threatflow-build-epss-silver = "threatflow.transformation.epss_silver:main"
threatflow-bootstrap-epss-silver = "threatflow.transformation.epss_silver_bootstrap:main"
threatflow-bootstrap-cisa-silver = "threatflow.transformation.cisa_silver_bootstrap:main"
threatflow-publish-cisa-silver = "threatflow.transformation.cisa_silver_publish:main"
threatflow-reconcile-nvd-silver = "threatflow.transformation.nvd_silver_reconciliation:main"
threatflow-bootstrap-nvd-silver = "threatflow.transformation.nvd_silver_bootstrap:main"
threatflow-publish-nvd-silver = "threatflow.transformation.nvd_silver_publish:main"
threatflow-build-reconstructed-gold = "threatflow.gold.local_reconstructed:main"
threatflow-sync-gold-catalog = "threatflow.gold.catalog:main"
threatflow-deploy-athena-views = "threatflow.gold.athena_views:main"

[dependency-groups]
dev = [
    "pyspark>=4.1,<4.2",
    "pytest>=8",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.10,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
