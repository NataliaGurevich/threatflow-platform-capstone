services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${THREATFLOW_POSTGRES_DB:-threatflow}
      POSTGRES_USER: ${THREATFLOW_POSTGRES_USER:-threatflow}
      POSTGRES_PASSWORD: ${THREATFLOW_POSTGRES_PASSWORD:?Set THREATFLOW_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
