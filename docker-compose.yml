x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: threatflow-airflow:3.1.0
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${THREATFLOW_POSTGRES_USER:-threatflow}:${THREATFLOW_POSTGRES_PASSWORD:?Set THREATFLOW_POSTGRES_PASSWORD in .env}@postgres:5432/airflow
    THREATFLOW_POSTGRES_HOST: postgres
    THREATFLOW_POSTGRES_DB: ${THREATFLOW_POSTGRES_DB:-threatflow}
    THREATFLOW_RAW_DATA_DIR: /opt/threatflow/data/raw
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/scripts:/opt/airflow/scripts:ro
    - ./data/raw:/opt/threatflow/data/raw
    - airflow_logs:/opt/airflow/logs
    - airflow_auth:/opt/airflow/auth
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    airflow-auth-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${THREATFLOW_POSTGRES_DB:-threatflow}
      POSTGRES_USER: ${THREATFLOW_POSTGRES_USER:-threatflow}
      POSTGRES_PASSWORD: ${THREATFLOW_POSTGRES_PASSWORD:?Set THREATFLOW_POSTGRES_PASSWORD in .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db-init:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGUSER: ${THREATFLOW_POSTGRES_USER:-threatflow}
      PGPASSWORD: ${THREATFLOW_POSTGRES_PASSWORD:?Set THREATFLOW_POSTGRES_PASSWORD in .env}
      PGDATABASE: ${THREATFLOW_POSTGRES_DB:-threatflow}
    command:
      - sh
      - -c
      - |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" |
        grep -q 1 ||
        psql -c 'CREATE DATABASE airflow'
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      airflow-auth-init:
        condition: service_completed_successfully
      threatflow-migrate:
        condition: service_completed_successfully
    command:
      - bash
      - /opt/airflow/scripts/init.sh

  airflow-auth-init:
    image: python:3.12-alpine
    environment:
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes:
      - airflow_auth:/opt/airflow/auth
    command:
      - python
      - -c
      - |
        import json
        import os
        from pathlib import Path

        auth_dir = Path('/opt/airflow/auth')
        password_file = auth_dir / 'passwords.json'
        auth_dir.chmod(0o700)
        password_file.write_text(json.dumps({os.environ['AIRFLOW_ADMIN_USERNAME']: os.environ['AIRFLOW_ADMIN_PASSWORD']}) + '\n')
        password_file.chmod(0o600)
        os.chown(auth_dir, 50000, 0)
        os.chown(password_file, 50000, 0)
    restart: 'no'

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - '8080:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(curl --fail --silent http://localhost:8080/api/v2/monitor/health | grep -o '"status":"healthy"' | wc -l)" -ge 2
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname $$(hostname)
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname $$(hostname)
      interval: 30s
      timeout: 10s
      retries: 5

  threatflow-migrate:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - cd /opt/threatflow && /opt/threatflow-venv/bin/alembic -c /opt/threatflow/alembic.ini upgrade head
    restart: 'no'

  airflow-maintenance:
    <<: *airflow-common
    command:
      - bash
      - /opt/airflow/scripts/maintenance.sh
    restart: 'no'
    profiles:
      - maintenance

volumes:
  postgres_data:
  airflow_logs:
  airflow_auth:
